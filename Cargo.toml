[package]
name = "anvil"
version = "0.2.0"
edition = "2021"
description = "A block-aware Linux terminal workspace built with Rust, GTK 4, Relm4, and VTE"
repository = "https://github.com/beamiter/anvil"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "gtk", "rust", "shell", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Pin the shared contract so a branch move cannot silently change a release build.
jterm_core = { git = "https://github.com/beamiter/jterm_core.git", rev = "68d57f3" }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
vte4 = { version = "0.10.0", features = ["v0_76"] }
log = { version = "0.4", features = ["std"] }
memchr = "2"
nix = { version = "0.31.3", features = ["term", "signal", "process", "ioctl", "fs"] }
pcre2-sys = "0.2.10"
toml = "1.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rkyv = { version = "0.8", features = ["bytecheck"] }
bytecheck = { version = "0.8", default-features = false }
zstd = "0.13"
regex = "1"
fuzzy-matcher = "0.3"
unicode-width = "0.2"
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
io-lifetimes = "3"
serde_yaml = "0.9"
env_logger = "0.11"

[dev-dependencies]

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

