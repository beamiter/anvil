app-id: io.github.beamiter.anvil
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: anvil

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=ssh-auth
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --env=ANVIL_ASSET_DIR=/app/share/anvil
  - --env=ANVIL_WORKFLOW_DIR=/app/share/anvil/workflows

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - '*.a'
  - '*.la'

modules:
  # Local task worktrees use a private Git binary. Interactive Git still
  # runs in the user's host shell.
  - name: task-git
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} prefix=/app gitexecdir=/app/libexec/jterm NO_GETTEXT=1 NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 git
      - install -Dm0755 git ${FLATPAK_DEST}/libexec/jterm/git
      - install -Dm0644 COPYING ${FLATPAK_DEST}/share/licenses/task-git/COPYING
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.1.tar.xz
        sha256: f0b0bf89264b9bd2e1c640363e7529643989da76281600473c50745cd34a607f

  - name: anvil
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/anvil/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --locked --features shared-terminal
      - install -Dm0755 target/release/anvil ${FLATPAK_DEST}/bin/anvil
      - install -Dm0755 scripts/support-bundle.sh ${FLATPAK_DEST}/bin/anvil-support-bundle
      - install -Dm0644 data/io.github.beamiter.anvil.desktop ${FLATPAK_DEST}/share/applications/io.github.beamiter.anvil.desktop
      - install -Dm0644 data/io.github.beamiter.anvil.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.beamiter.anvil.metainfo.xml
      - install -Dm0644 data/io.github.beamiter.anvil.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.beamiter.anvil.svg
      - install -Dm0644 data/io.github.beamiter.anvil-128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.beamiter.anvil.png
      - install -Dm0644 data/io.github.beamiter.anvil-256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.beamiter.anvil.png
      - install -Dm0644 scripts/shell-integration/README.md ${FLATPAK_DEST}/share/anvil/shell-integration/README.md
      - install -Dm0644 scripts/shell-integration/anvil.bash ${FLATPAK_DEST}/share/anvil/shell-integration/anvil.bash
      - install -Dm0644 scripts/shell-integration/anvil.zsh ${FLATPAK_DEST}/share/anvil/shell-integration/anvil.zsh
      - install -Dm0644 scripts/shell-integration/anvil.fish ${FLATPAK_DEST}/share/anvil/shell-integration/anvil.fish
      - install -Dm0644 scripts/shell-integration/anvil.ps1 ${FLATPAK_DEST}/share/anvil/shell-integration/anvil.ps1
      - install -Dm0644 scripts/workflows/docker-tail-logs.yaml ${FLATPAK_DEST}/share/anvil/workflows/docker-tail-logs.yaml
      - install -Dm0644 scripts/workflows/find-large-files.yaml ${FLATPAK_DEST}/share/anvil/workflows/find-large-files.yaml
      - install -Dm0644 scripts/workflows/git-feature.yaml ${FLATPAK_DEST}/share/anvil/workflows/git-feature.yaml
      - install -Dm0644 scripts/workflows/git-rebase-interactive.yaml ${FLATPAK_DEST}/share/anvil/workflows/git-rebase-interactive.yaml
      - install -Dm0644 scripts/workflows/kill-port.yaml ${FLATPAK_DEST}/share/anvil/workflows/kill-port.yaml
      - install -Dm0644 scripts/workflows/ssh-tunnel.yaml ${FLATPAK_DEST}/share/anvil/workflows/ssh-tunnel.yaml
      - install -Dm0644 scripts/notebooks/welcome.jtnb.md ${FLATPAK_DEST}/share/anvil/notebooks/welcome.jtnb.md
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - target
      - cargo-sources.json
