name: Native Block interaction smoke

# A reviewed-source gate: it measures only a candidate whose parent a source
# review has approved. On push it failed by design for every later commit, so
# it runs on demand instead. The reviewer dispatches it on the reviewed
# candidate and names that candidate's reviewed parent; nothing is discovered
# or accepted at runtime, and every identity check below still applies.
on:
  workflow_dispatch:
    inputs:
      candidate_parent_sha:
        description: Reviewed parent of the dispatched candidate commit (full SHA)
        required: true
        type: string
      baseline_sha:
        description: Immutable baseline commit (full SHA)
        required: true
        type: string
        default: 88c3f4c565cb5b9f8d47d22eb3ad07f47a822ae4

permissions:
  contents: read

concurrency:
  group: native-block-interaction-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-smoke:
    name: Paired Block virtual-pixel correctness and cleanup only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
      RUST_BACKTRACE: '1'
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      # The reviewed parent named by the dispatching reviewer; a later change
      # still requires a new source review before it is dispatched.
      CANDIDATE_PARENT_SHA: ${{ inputs.candidate_parent_sha }}
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "candidate/scripts/materialize-shared-core.sh" ]]; then
            bash "candidate/scripts/materialize-shared-core.sh"
          fi
      - name: Check out immutable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "baseline/scripts/materialize-shared-core.sh" ]]; then
            bash "baseline/scripts/materialize-shared-core.sh"
          fi
      - name: Install native smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pkg-config libgtk-4-dev \
            libadwaita-1-dev libvte-2.91-gtk4-dev libxtst6 python3 dbus-x11 \
            xauth xdotool xvfb fonts-dejavu-core
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Prepare identical disposable instrumentation
        run: |
          mkdir -p evidence binaries
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate show -s --format=%P HEAD | wc -w)" -eq 1
          test "$(git -C candidate rev-parse HEAD^)" = "$CANDIDATE_PARENT_SHA"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          Path('evidence/source-identities.json').write_text(json.dumps({
              'baseline_sha': os.environ['BASELINE_SHA'],
              'candidate_sha': os.environ['GITHUB_SHA'],
              'candidate_parent_sha': os.environ['CANDIDATE_PARENT_SHA'],
              'purpose': 'short virtual-display pixel and drag correctness, descriptive observer cost only',
              'budget_acceptance': False}, indent=2) + '\n')
          PYCODE
          python3 candidate/scripts/prepare-interaction-budget.py baseline observed-baseline > evidence/baseline-overlay.json
          python3 candidate/scripts/prepare-interaction-budget.py candidate observed-candidate > evidence/candidate-overlay.json
          cmp evidence/baseline-overlay.json evidence/candidate-overlay.json
          python3 -I candidate/scripts/build-interaction-smoke.py --record-source baseline observed-baseline
          python3 -I candidate/scripts/build-interaction-smoke.py --record-source candidate observed-candidate
          python3 candidate/scripts/test-interaction-budget.py
          python3 candidate/scripts/test-interaction-lineage.py
          python3 candidate/scripts/test-interaction-pty-fixture.py
          python3 candidate/scripts/test-interaction-budget-collector.py
          python3 candidate/scripts/test-interaction-smoke.py
          python3 candidate/scripts/test-interaction-pixel-codec.py
          python3 candidate/scripts/test-interaction-pixel-observer.py
          python3 candidate/scripts/test-interaction-input-helper.py
          python3 candidate/scripts/test-interaction-native-coordinates.py
          python3 candidate/scripts/test-interaction-surface-roles.py
          python3 candidate/scripts/test-interaction-divider-roi.py
          python3 candidate/scripts/test-interaction-divider-shape.py
          python3 candidate/scripts/test-interaction-pixel-client.py
          python3 candidate/scripts/test-interaction-pixels.py
          python3 candidate/scripts/test-interaction-pixel-gate.py
          rustc -vV > evidence/rustc.txt
          cargo -vV > evidence/cargo.txt
          uname -a > evidence/kernel.txt
          dpkg-query -W libgtk-4-1 libvte-2.91-gtk4-0 libadwaita-1-0 fonts-dejavu-core > evidence/packages.txt
      - name: Build disposable baseline and candidate binaries
        run: |
          python3 -I candidate/scripts/build-interaction-smoke.py --source observed-baseline \
            --target baseline-target --binary binaries/baseline --evidence evidence --role baseline
          python3 -I candidate/scripts/build-interaction-smoke.py --source observed-candidate \
            --target candidate-target --binary binaries/candidate --evidence evidence --role candidate
          if cmp -s binaries/baseline binaries/candidate; then
            echo 'Refusing identical baseline/candidate binaries for these distinct sources' >&2
            exit 1
          fi
          sha256sum binaries/* > evidence/binaries.sha256
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
      - name: Run short paired 1, 8 and 32-total pane pixel/control gates
        run: |
          python3 candidate/scripts/run-interaction-pixel-gate.py \
            --baseline-binary "$PWD/binaries/baseline" --candidate-binary "$PWD/binaries/candidate" \
            --baseline-sha "$BASELINE_SHA" --candidate-sha "$GITHUB_SHA" \
            --output "$PWD/evidence"
      - name: Upload raw smoke evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-block-smoke-${{ github.sha }}
          path: |
            evidence/
            binaries/
          if-no-files-found: error
          retention-days: 7
