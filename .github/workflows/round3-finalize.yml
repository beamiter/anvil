name: One-shot finalize round 3 configuration integrity

on:
  pull_request:
    branches:
      - agent/round3-staging-base
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: round3-config-integrity-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v5
        with:
          ref: agent/config-integrity-finalize
          fetch-depth: 0

      - name: Install formatting toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Reconstruct and apply reviewed patch
        run: |
          set -euo pipefail
          exec > >(tee /tmp/round3-finalize.log) 2>&1
          git fetch --no-tags origin agent/config-integrity-evolution
          : > /tmp/round3.patch
          for part in 00 01 02 03 04; do
            path="scripts/.round3-patch.${part}"
            commit="$(git log --all --diff-filter=A --format=%H -- "${path}" | tail -n 1)"
            if [[ -z "${commit}" ]]; then
              echo "Could not locate the addition commit for ${path}." >&2
              exit 1
            fi
            echo "${path}: ${commit}"
            git show "${commit}:${path}" >> /tmp/round3.patch
          done
          sha256sum /tmp/round3.patch | tee /tmp/round3-patch.sha256
          echo 'b5491fc8b11a843f89aa9ec28544943c55143c4a82f83f5e136d3065d6d8b20f  /tmp/round3.patch' | sha256sum --check
          git apply --check /tmp/round3.patch
          git apply /tmp/round3.patch
          cargo fmt --all

          bash -n scripts/*.sh packaging/*.sh
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          tomllib.loads(Path('config.toml.example').read_text(encoding='utf-8'))
          PY
          git diff --check

      - name: Upload finalizer diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: round3-finalizer-diagnostics
          path: |
            /tmp/round3-finalize.log
            /tmp/round3-patch.sha256
            /tmp/round3.patch
          if-no-files-found: warn
          retention-days: 1

      - name: Remove all temporary migration material
        run: |
          rm -f \
            .github/workflows/round3-source-snapshot.yml \
            .github/workflows/round3-finalize.yml \
            scripts/.round3-payload.* \
            scripts/.round3-patch.*

      - name: Commit and publish final product source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize transactional configuration integrity"
          git push origin HEAD:agent/config-integrity-finalize
