name: Apply Warp multi-block selection patch

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - agent/warp-multi-block-selection
    paths:
      - .agent-warp-multi-selection-trigger

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-multi-block-selection
          fetch-depth: 0

      - name: Decode and apply source patch
        shell: bash
        run: |
          cat <<'PATCH_PAYLOAD' | base64 -d | gzip -d > /tmp/agent_warp_multi_selection.py
          
          PATCH_PAYLOAD
          python3 /tmp/agent_warp_multi_selection.py
          cargo fmt --all

      - name: Install GTK and VTE development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: xvfb-run --auto-servernum cargo test --all-targets --no-fail-fast

      - name: Run Clippy
        run: |
          cargo clippy --all-targets -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::doc_lazy_continuation \
            -A clippy::items_after_test_module \
            -A clippy::too_many_arguments \
            -A clippy::manual_clamp \
            -A clippy::if_same_then_else \
            -A clippy::needless_range_loop

      - name: Remove temporary patch machinery
        run: |
          rm -f .agent-warp-multi-selection-trigger
          rm -f .github/workflows/agent-warp-multi-selection.yml

      - name: Commit source changes
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "Align Warp multi-block selection and history navigation"
          git push origin HEAD:agent/warp-multi-block-selection
