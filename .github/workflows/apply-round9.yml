name: Apply round 9 extraction

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/jterm1-agent-workflow-filetree-modules' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jterm1-agent-workflow-filetree-modules
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Extract Agent, workflow, and file-tree operations
        run: |
          python3 .github/scripts/migrate_round9.py
          cargo fmt --all
          git rm .github/scripts/migrate_round9.py .github/workflows/apply-round9.yml .round9-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/agent_ops.rs src/workflow_ops.rs src/file_tree_ops.rs
          git commit -m "Extract agent workflow and file tree operations"
          git push origin HEAD:agent/jterm1-agent-workflow-filetree-modules
