name: Apply round 10 extraction

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/jterm1-ai-startup-ui-modules' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jterm1-ai-startup-ui-modules
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Extract AI and startup UI operations
        run: |
          python3 .github/scripts/migrate_round10.py
          cargo fmt --all
          git rm .github/scripts/migrate_round10.py .github/workflows/apply-round10.yml .round10-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/ai_palette_ops.rs src/startup_ui.rs
          git commit -m "Extract AI and startup UI operations"
          git push origin HEAD:agent/jterm1-ai-startup-ui-modules
