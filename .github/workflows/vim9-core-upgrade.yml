name: Prepare Vim9 core upgrade

on:
  push:
    branches: [master]
    paths: [.github/workflows/vim9-core-upgrade.yml]
  workflow_dispatch:
    inputs:
      core_revision:
        description: Full jterm_core commit SHA
        required: true
        default: d0e27eac29eaec790c00a63d7b0065f21d14fd1f

permissions:
  contents: write

concurrency:
  group: vim9-core-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applicability:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      applicable: ${{ steps.core_mode.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Git-repin automation applicability
        id: core_mode
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          core = manifest.get('dependencies', {}).get('jterm_core', {})
          applicable = isinstance(core, dict) and core.get('git') == 'https://github.com/beamiter/jterm_core.git'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'applicable={str(applicable).lower()}\n')
          if not applicable:
              message = 'Shared core uses bundled snapshot; Git-repin automation not applicable. Regenerate snapshot after core changes.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
          PYTHON

  prepare:
    needs: applicability
    if: needs.applicability.outputs.applicable == 'true'
    uses: beamiter/jterm_core/.github/workflows/prepare-vim9-core.yml@d0e27eac29eaec790c00a63d7b0065f21d14fd1f
    with:
      core_revision: ${{ inputs.core_revision || 'd0e27eac29eaec790c00a63d7b0065f21d14fd1f' }}
