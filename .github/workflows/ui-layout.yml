name: Native conversation layout

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ui-layout-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  native-layout:
    name: Composer and native conversation geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Materialize bundled shared core
        run: bash scripts/materialize-shared-core.sh

      - name: Install GTK, VTE, and isolated display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            dbus-x11 xauth xvfb fonts-dejavu-core

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ui-layout-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ui-layout-
            ${{ runner.os }}-cargo-

      - name: Compile application tests
        run: cargo test --locked --bin anvil --no-run

      - name: Check composer budget and native message geometry
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          tests=(
            pty::tests::live_display_recorder_uses_owned_child_teardown
            block_view::chat::tests::block_input_rows_keep_four_lines_and_bottom_space
            block_view::chat_layout_tests::chat_bubbles_keep_alignment_through_resize_and_font_changes
            workspace_conversation::tests::user_capsules_follow_reading_edge_and_wrap_in_narrow_windows
            block_view::chat::tests::chat_completion_never_expands_between_shell_markers
          )
          listed_tests="$(cargo test --locked --bin anvil -- --list --include-ignored)"
          failed=0
          for test_name in "${tests[@]}"; do
            if ! grep -Fxq "${test_name}: test" <<< "$listed_tests"; then
              printf 'Required layout test not found: %s\n' "$test_name" >&2
              failed=1
              continue
            fi
            if ! dbus-run-session -- xvfb-run --auto-servernum \
              cargo test --locked --bin anvil "$test_name" \
              -- --exact --include-ignored --test-threads=1; then
              failed=1
            fi
          done
          exit "$failed"
