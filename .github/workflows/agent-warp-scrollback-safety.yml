name: Apply finished snapshot settling safety

on:
  push:
    branches:
      - agent/warp-block-detail-parity
    paths:
      - .agent-warp-scrollback-safety-trigger
  pull_request:
    branches:
      - master
    paths:
      - .agent-warp-scrollback-safety-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-block-detail-parity
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/agent_warp_scrollback_safety.py

      - name: Format Rust sources
        run: |
          rustup component add rustfmt
          cargo fmt --all

      - name: Remove temporary patch machinery
        run: |
          rm -f .agent-warp-scrollback-safety-trigger
          rm -f .github/scripts/agent_warp_scrollback_safety.py
          rm -f .github/workflows/agent-warp-scrollback-safety.yml

      - name: Commit source changes
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Keep finished snapshot capture capacity race-safe"
          git push origin HEAD:agent/warp-block-detail-parity
