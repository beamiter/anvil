name: One-shot resilience evolution

on:
  push:
    branches:
      - agent/resilience-observability-evolution
  pull_request:
    branches:
      - master
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resilience-evolution-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  evolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out evolution branch
        uses: actions/checkout@v5
        with:
          ref: agent/resilience-observability-evolution
          fetch-depth: 0

      - name: Install formatting toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Apply deterministic migration
        run: |
          rm -f .github/evolve-round2-error.log migration.log
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          anchor = "make help      # all helpers\n"
          if "make clippy    # repository lint policy\n" not in content:
              if content.count(anchor) != 1:
                  raise SystemExit("README development-command anchor is ambiguous")
              content = content.replace(
                  anchor,
                  "make clippy    # repository lint policy\n" + anchor,
                  1,
              )
              readme.write_text(content, encoding="utf-8")

          contributing = Path("CONTRIBUTING.md")
          content = contributing.read_text(encoding="utf-8")
          first_block = "nix develop\nmake verify\n```\n"
          if "nix develop\nmake verify\nmake security\n```\n" not in content:
              if content.count(first_block) != 1:
                  raise SystemExit("CONTRIBUTING development block is ambiguous")
              content = content.replace(
                  first_block,
                  "nix develop\nmake verify\nmake security\n```\n",
                  1,
              )
              contributing.write_text(content, encoding="utf-8")
          PY

          set +e
          python3 scripts/evolve_round2.py >migration.log 2>&1
          status=$?
          cat migration.log
          if (( status != 0 )); then
            mkdir -p .github
            cp migration.log .github/evolve-round2-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/evolve-round2-error.log
            git commit -m "Capture resilience migration failure"
            git push origin HEAD:agent/resilience-observability-evolution
            exit "${status}"
          fi

      - name: Format and validate generated sources
        run: |
          cargo fmt --all
          python3 -m py_compile scripts/evolve_round2.py
          bash -n scripts/*.sh packaging/*.sh
          git diff --check

      - name: Commit and publish evolved source
        run: |
          rm -f migration.log
          rm -rf scripts/__pycache__
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No migration changes were produced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add resilient startup, diagnostics, and security tooling"

          for attempt in 1 2 3; do
            git fetch origin agent/resilience-observability-evolution
            git rebase origin/agent/resilience-observability-evolution
            if git push origin HEAD:agent/resilience-observability-evolution; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after refresh."
          done
          echo "Unable to publish the generated commit after three attempts." >&2
          exit 1
