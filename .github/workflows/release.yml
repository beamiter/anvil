name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  release:
    name: Build and publish Linux bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GTK and VTE development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            xauth \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify tag matches Cargo package version
        run: |
          version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}." >&2
            exit 1
          fi

      - name: Run release tests
        run: xvfb-run --auto-servernum cargo test --all-targets --locked --no-fail-fast

      - name: Build optimized binary and bundle
        run: |
          cargo build --release --locked
          bash scripts/package-release.sh target/release/jterm1
          (cd target/dist && sha256sum --check *.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(target/dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "jterm1 ${GITHUB_REF_NAME#v}"
          fi
