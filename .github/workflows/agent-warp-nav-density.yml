name: Apply Warp block navigation and density polish

on:
  push:
    branches:
      - agent/warp-block-navigation-density
    paths:
      - .agent-warp-nav-density-trigger

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-block-navigation-density
          fetch-depth: 0

      - name: Install GTK and VTE development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Apply source patch
        run: python3 .github/scripts/agent_warp_nav_density.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: xvfb-run --auto-servernum cargo test --all-targets --no-fail-fast

      - name: Run Clippy
        run: |
          cargo clippy --all-targets -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::doc_lazy_continuation \
            -A clippy::items_after_test_module \
            -A clippy::too_many_arguments \
            -A clippy::manual_clamp \
            -A clippy::if_same_then_else \
            -A clippy::needless_range_loop

      - name: Remove temporary patch machinery
        run: |
          rm -f .agent-warp-nav-density-trigger
          rm -f .github/scripts/agent_warp_nav_density.py
          rm -f .github/workflows/agent-warp-nav-density.yml

      - name: Commit source changes
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Polish Warp long-block navigation and compact mode"
          git push origin HEAD:agent/warp-block-navigation-density
