name: Context pending selection validation
on:
  push:
    branches: [diagnostics/anvil-context-queue]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_A11Y: none
      GTK_IM_MODULE: simple
      G_DEBUG: fatal-warnings
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/materialize-shared-core.sh
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev xvfb xauth dbus-x11 libxtst6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - name: Format and record exact tested source
        run: |
          ulimit -c 0
          cargo fmt --all
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ('src/workspace_context.rs', 'src/workspace_context_ui.rs'):
              print('FORMATTED_SOURCE', name, base64.b64encode(Path(name).read_bytes()).decode())
          PY
          cargo fmt --all -- --check
      - name: Clippy and context model tests
        run: |
          ulimit -c 0
          cargo clippy --bin anvil --locked -- -D warnings
          cargo test --bin anvil --locked workspace_context::tests
      - name: Native FIFO and iterator regressions
        run: |
          ulimit -c 0
          for name in pending_context_additions_preserve_order_capacity_and_cancellation; do
            dbus-run-session -- xvfb-run --auto-servernum cargo test --bin anvil --locked "workspace_context_ui::tests::$name" -- --ignored --exact --nocapture
          done
      - name: Overwrite mutation control must fail
        shell: bash
        run: |
          ulimit -c 0
          set -Eeuo pipefail
          file=src/workspace_context_ui.rs
          cp "$file" "$RUNNER_TEMP/context-fixed.rs"
          trap 'cp "$RUNNER_TEMP/context-fixed.rs" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/workspace_context_ui.rs')
          s = p.read_text()
          old = 'self.pending_additions.borrow_mut().push_back(addition);'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'self.pending_additions.borrow_mut().clear();\n        ' + old))
          PY
          set +e
          dbus-run-session -- xvfb-run --auto-servernum cargo test --bin anvil --locked workspace_context_ui::tests::pending_context_additions_preserve_order_capacity_and_cancellation -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/overwrite-control.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'left: 1' "$RUNNER_TEMP/overwrite-control.log"
          grep -F 'right: 3' "$RUNNER_TEMP/overwrite-control.log"
          echo "Confirmed overwrite semantics loses pending selections (status $status)"
      - name: Script contracts
        if: ${{ !cancelled() }}
        run: python3 scripts/test-gtk-display-contract.py
