name: Apply action and settings extraction

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/jterm1-action-settings-modules' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/jterm1-action-settings-modules
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Extract action and settings operations
        run: |
          python3 .github/round7_jterm1.py
          cargo fmt --all
          git rm .github/round7_jterm1.py .github/workflows/apply-round7-jterm1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/action_ops.rs src/settings_ops.rs
          git commit -m "Extract action and settings operations"
          git push origin HEAD:agent/jterm1-action-settings-modules
