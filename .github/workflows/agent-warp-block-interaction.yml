name: Apply Warp block interaction patch

on:
  pull_request:
    branches:
      - master
    paths:
      - .agent-warp-block-interaction-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-block-detail-parity
          fetch-depth: 0

      - name: Capture patch diagnostics
        run: |
          set +e
          python3 .github/scripts/agent_warp_block_interaction.py > .agent-warp-block-interaction-result 2>&1
          status=$?
          echo "status=$status" >> .agent-warp-block-interaction-result
          cat .agent-warp-block-interaction-result
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add .agent-warp-block-interaction-result
          git commit -m "Record Warp interaction patch diagnostics"
          git push origin HEAD:agent/warp-block-detail-parity
