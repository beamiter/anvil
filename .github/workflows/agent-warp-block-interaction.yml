name: Apply Warp block interaction patch

on:
  pull_request:
    branches:
      - master
    paths:
      - .agent-warp-block-interaction-trigger

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-block-detail-parity
          fetch-depth: 0

      - name: Capture patch diagnostics
        run: |
          set +e
          python3 .github/scripts/agent_warp_block_interaction.py > warp-block-interaction-result.txt 2>&1
          status=$?
          echo "status=$status" >> warp-block-interaction-result.txt
          cat warp-block-interaction-result.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: warp-block-interaction-diagnostics
          path: warp-block-interaction-result.txt
          retention-days: 1
