name: Diagnose Warp multi-block selection compile

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-multi-block-selection

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Extract, correct, and apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          workflow = pathlib.Path('.github/workflows/agent-warp-multi-selection.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "cat <<'PATCH_PAYLOAD'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PATCH_PAYLOAD')
          payload = ''.join(line.strip() for line in workflow[start:end])
          script = gzip.decompress(base64.b64decode(payload)).decode()
          patch_start = script.index('text = replace_once(\n    text,\n    "                    select_finished_block(&finished, &selected_block_id_for_key, None);"')
          patch_end = script.index('text = replace_once(\n    text,\n    "                    let new_id = finished.get(idx)', patch_start)
          corrected = '''text = replace_count(
              text,
              "                    select_finished_block(&finished, &selected_block_id_for_key, None);",
              "                    clear_finished_block_selection(\\n                        &finished,\\n                        &selected_block_ids_for_key,\\n                        &selected_block_id_for_key,\\n                        &selection_anchor_id_for_key,\\n                    );",
              2,
              "clear selection after Enter and Escape",
          )
          '''
          pathlib.Path('/tmp/agent_warp_multi_selection.py').write_text(script[:patch_start] + corrected + script[patch_end:])
          PY
          python3 /tmp/agent_warp_multi_selection.py
          cargo fmt --all

      - name: Capture cargo check
        shell: bash
        run: |
          set +e
          cargo check --all-targets > check.log 2>&1
          echo $? > check-status.txt
          tail -n 160 check.log
          exit 0

      - name: Upload compile diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: warp-multi-selection-compile-diagnostics
          path: |
            check.log
            check-status.txt
          retention-days: 1
