name: Native Vim pixel viewport

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vim9-pixel-viewport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gtk-pixel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-vim-core-upgrade
      - name: Install GTK test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev xvfb dbus-x11 vim-nox ripgrep
      - run: cargo fmt --all -- --check
      - run: cargo check --quiet --locked --all-targets
      - run: cargo test --quiet --locked vim9 -- --test-threads=1
      - name: Exercise real GTK snapshot and source coordinates
        run: dbus-run-session -- xvfb-run -a cargo test --quiet --locked native_pixel_snapshot_and_source_hit_round_trip -- --ignored --test-threads=1
