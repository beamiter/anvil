name: One-shot round 3 configuration integrity

on:
  push:
    branches:
      - agent/config-integrity-evolution
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: round3-config-integrity
  cancel-in-progress: true

jobs:
  evolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out evolution branch
        uses: actions/checkout@v5
        with:
          ref: agent/config-integrity-evolution
          fetch-depth: 0

      - name: Install formatting toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Apply reviewed configuration-integrity patch
        run: |
          set -euo pipefail
          cat scripts/.round3-patch.* > /tmp/round3.patch
          git apply --check /tmp/round3.patch
          git apply /tmp/round3.patch
          cargo fmt --all

          bash -n scripts/*.sh packaging/*.sh
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          tomllib.loads(Path('config.toml.example').read_text(encoding='utf-8'))
          PY
          git diff --check

      - name: Remove one-shot migration materials
        run: |
          rm -f \
            .github/workflows/round3-source-snapshot.yml \
            scripts/.round3-payload.* \
            scripts/.round3-patch.*

      - name: Commit and publish evolved source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make configuration writes transactional and conflict-aware"
          git push origin HEAD:agent/config-integrity-evolution
