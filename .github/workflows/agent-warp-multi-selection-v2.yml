name: Apply Warp multi-block selection patch v2

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-multi-block-selection
          fetch-depth: 0

      - name: Extract and correct source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          workflow = pathlib.Path('.github/workflows/agent-warp-multi-selection.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "cat <<'PATCH_PAYLOAD'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PATCH_PAYLOAD')
          payload = ''.join(line.strip() for line in workflow[start:end])
          script = gzip.decompress(base64.b64decode(payload)).decode()
          patch_start = script.index('text = replace_once(\n    text,\n    "                    select_finished_block(&finished, &selected_block_id_for_key, None);"')
          patch_end = script.index('text = replace_once(\n    text,\n    "                    let new_id = finished.get(idx)', patch_start)
          corrected = '''text = replace_count(
              text,
              "                    select_finished_block(&finished, &selected_block_id_for_key, None);",
              "                    clear_finished_block_selection(\\n                        &finished,\\n                        &selected_block_ids_for_key,\\n                        &selected_block_id_for_key,\\n                        &selection_anchor_id_for_key,\\n                    );",
              2,
              "clear selection after Enter and Escape",
          )
          '''
          script = script[:patch_start] + corrected + script[patch_end:]
          pathlib.Path('/tmp/agent_warp_multi_selection.py').write_text(script)
          PY

      - name: Apply source patch
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 /tmp/agent_warp_multi_selection.py 2>&1 | tee patch.log

      - name: Upload patch diagnostics
        if: ${{ steps.apply.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: warp-multi-selection-v2-diagnostics
          path: patch.log
          retention-days: 1

      - name: Stop after patch failure
        if: ${{ steps.apply.outcome == 'failure' }}
        run: exit 1

      - name: Format source
        run: cargo fmt --all

      - name: Install GTK and VTE development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: xvfb-run --auto-servernum cargo test --all-targets --no-fail-fast

      - name: Run Clippy
        run: |
          cargo clippy --all-targets -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::doc_lazy_continuation \
            -A clippy::items_after_test_module \
            -A clippy::too_many_arguments \
            -A clippy::manual_clamp \
            -A clippy::if_same_then_else \
            -A clippy::needless_range_loop

      - name: Remove temporary patch machinery
        run: |
          rm -f .agent-warp-multi-selection-trigger
          rm -f .github/workflows/agent-warp-multi-selection.yml
          rm -f .github/workflows/agent-warp-multi-selection-diagnostics.yml
          rm -f .github/workflows/agent-warp-multi-selection-v2.yml

      - name: Commit source changes
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "Align Warp multi-block selection and history navigation"
          git push origin HEAD:agent/warp-multi-block-selection
