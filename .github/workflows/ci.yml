name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # Explicit Bash gives every run step `-e -o pipefail`, so a failing
        # Cargo command cannot be hidden by the following `tee` process.
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTK and VTE development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        id: tests
        run: xvfb-run --auto-servernum cargo test --all-targets --no-fail-fast 2>&1 | tee test.log

      - name: Run Clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: |
          # These structural/style lints are the explicit legacy baseline. All
          # other Rust and Clippy warnings remain denied and fail the build.
          cargo clippy --all-targets -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::doc_lazy_continuation \
            -A clippy::items_after_test_module \
            -A clippy::too_many_arguments \
            -A clippy::manual_clamp \
            -A clippy::if_same_then_else \
            -A clippy::needless_range_loop \
            2>&1 | tee clippy.log

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test.log
            clippy.log
          if-no-files-found: ignore
          retention-days: 7
