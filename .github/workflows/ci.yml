name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/warp-multi-block-selection
          fetch-depth: 0

      - name: Finalize modifier-click propagation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/block_view/mod.rs")
          text = path.read_text()
          start = text.index("fn install_finished_block_selection(")
          end = text.index("    block.widget().add_controller(left_click);", start)
          segment = text[start:end]

          old = """        let shift = state.contains(gtk::gdk::ModifierType::SHIFT_MASK);
                  if y <= header_for_click.height() as f64 || shift {"""
          new = """        let shift = state.contains(gtk::gdk::ModifierType::SHIFT_MASK);
                  let over_terminal_surface = y > header_for_click.height() as f64;
                  if !over_terminal_surface || shift {"""
          if segment.count(old) != 1:
              raise SystemExit(f"gesture condition: expected one match, found {segment.count(old)}")
          segment = segment.replace(old, new, 1)

          old = """        }
                  gesture.set_state(gtk::EventSequenceState::Denied);
              });"""
          new = """        }
                  // A modifier click on command/output is a block-selection gesture,
                  // not the start of a native VTE text selection. Header clicks still
                  // proceed so collapse/action buttons receive their own sequence.
                  gesture.set_state(if shift && over_terminal_surface {
                      gtk::EventSequenceState::Claimed
                  } else {
                      gtk::EventSequenceState::Denied
                  });
              });"""
          if segment.count(old) != 1:
              raise SystemExit(f"gesture final state: expected one match, found {segment.count(old)}")
          segment = segment.replace(old, new, 1)

          path.write_text(text[:start] + segment + text[end:])
          PY
          cargo fmt --all

      - name: Install GTK and VTE development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: xvfb-run --auto-servernum cargo test --all-targets --no-fail-fast

      - name: Run Clippy
        run: |
          cargo clippy --all-targets -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::doc_lazy_continuation \
            -A clippy::items_after_test_module \
            -A clippy::too_many_arguments \
            -A clippy::manual_clamp \
            -A clippy::if_same_then_else \
            -A clippy::needless_range_loop

      - name: Restore repository workflow and remove temporary machinery
        run: |
          git checkout origin/master -- .github/workflows/ci.yml
          rm -f .agent-warp-selection-gesture-fix-trigger
          rm -f .github/workflows/agent-warp-selection-gesture-fix.yml
          rm -f .github/workflows/agent-warp-selection-gesture-fix-v2.yml
          rm -f test.log clippy.log

      - name: Commit finalized source
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No finalized source changes to commit"
            exit 1
          fi
          git commit -m "Prevent modifier block selection from leaking into VTE text selection"
          git push origin HEAD:agent/warp-multi-block-selection
