name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust quality, smoke tests, and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install GTK, VTE, and validation packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            desktop-file-utils \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run tests
        id: tests
        run: xvfb-run --auto-servernum cargo test --all-targets --locked --no-fail-fast 2>&1 | tee test.log

      - name: Run Clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: bash scripts/clippy.sh 2>&1 | tee clippy.log

      - name: Check documentation build
        if: ${{ !cancelled() }}
        run: cargo doc --no-deps --locked

      - name: Build optimized release binary
        if: ${{ !cancelled() }}
        run: cargo build --release --locked

      - name: Validate CLI and desktop integration
        if: ${{ !cancelled() }}
        run: |
          target/release/jterm1 --help | grep -F "Block-first terminal workspace"
          version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          target/release/jterm1 --version | grep -Fx "jterm1 ${version}"
          target/release/jterm1 --doctor
          target/release/jterm1 --doctor --json | python3 -m json.tool >/dev/null
          desktop-file-validate packaging/app.jterm1.desktop

      - name: Build and verify portable release bundle
        if: ${{ !cancelled() }}
        run: |
          bash scripts/package-release.sh target/release/jterm1
          (cd target/dist && sha256sum --check *.sha256)
          JTERM1_BIN=target/release/jterm1 bash scripts/support-bundle.sh target/support
          tar -tzf target/support/jterm1-support-*.tar.gz | grep -F '/doctor.json'

      - name: Upload portable release bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: jterm1-${{ github.sha }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: |
            test.log
            clippy.log
          if-no-files-found: ignore
          retention-days: 7

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate and build flake checks
        run: nix flake check --no-write-lock-file --print-build-logs
