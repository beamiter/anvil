name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust quality, smoke tests, and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install GTK, VTE, and validation packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            appstream \
            desktop-file-utils \
            file \
            xauth \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run tests
        id: tests
        run: xvfb-run --auto-servernum cargo test --all-targets --locked --no-fail-fast 2>&1 | tee test.log

      - name: Run Clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: bash scripts/clippy.sh 2>&1 | tee clippy.log

      - name: Check documentation build
        if: ${{ !cancelled() }}
        run: cargo doc --no-deps --locked

      - name: Build optimized release binary
        if: ${{ !cancelled() }}
        run: cargo build --release --locked

      - name: Validate install and support scripts
        if: ${{ !cancelled() }}
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-paths.sh \
            scripts/package-release.sh scripts/support-bundle.sh packaging/install-release.sh
          scripts/install.sh --help >/dev/null
          scripts/uninstall.sh --help >/dev/null
          bash scripts/test-install-paths.sh
          install_plan="$(scripts/install.sh --backend cargo --no-config --no-desktop --dry-run)"
          grep -F "Installed anvil to ${HOME}/.local/bin/anvil" <<<"${install_plan}"

          prefix_plan="$(scripts/install.sh --backend cargo --no-config --no-desktop \
            --prefix /opt/anvil-prefix --dry-run)"
          grep -F "Installed anvil to /opt/anvil-prefix/bin/anvil" <<<"${prefix_plan}"

          bin_plan="$(scripts/install.sh --backend cargo --no-config --no-desktop \
            --prefix /opt/anvil-prefix --bin-dir /opt/anvil-bin --dry-run)"
          grep -F "Installed anvil to /opt/anvil-bin/anvil" <<<"${bin_plan}"

          uninstall_stage="$(mktemp -d)"
          trap 'rm -rf -- "${uninstall_stage}"' EXIT
          install -Dm0755 /bin/true "${uninstall_stage}${HOME}/.local/bin/anvil"
          uninstall_plan="$(DESTDIR="${uninstall_stage}" scripts/uninstall.sh --dry-run)"
          grep -F "${uninstall_stage}${HOME}/.local/bin/anvil" <<<"${uninstall_plan}"

      - name: Validate CLI and desktop integration
        if: ${{ !cancelled() }}
        run: |
          target/release/anvil --help | grep -F "Block-first terminal workspace"
          version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          target/release/anvil --version | grep -Fx "anvil ${version}"
          target/release/anvil --doctor
          target/release/anvil --doctor --json | python3 -m json.tool >/dev/null
          target/release/anvil --check-config config.toml.example --json | \
            python3 -m json.tool >/dev/null

          config_root="$(mktemp -d)"
          install -d -m 0700 "${config_root}/anvil"
          cp config.toml.example "${config_root}/anvil/config.toml"
          XDG_CONFIG_HOME="${config_root}" target/release/anvil --check-config
          test "$(XDG_CONFIG_HOME="${config_root}" target/release/anvil --config-path)" = \
            "${config_root}/anvil/config.toml"

          cp "${config_root}/anvil/config.toml" "${config_root}/anvil/config.toml.bak"
          printf 'opacity = "wrong"\n' >"${config_root}/anvil/config.toml"
          if XDG_CONFIG_HOME="${config_root}" target/release/anvil --check-config; then
            echo "invalid configuration unexpectedly passed validation" >&2
            exit 1
          fi
          XDG_CONFIG_HOME="${config_root}" target/release/anvil --restore-config-backup
          XDG_CONFIG_HOME="${config_root}" target/release/anvil --check-config
          test -s "${config_root}/anvil/config.toml.before-restore"
          desktop-file-validate data/io.github.beamiter.anvil.desktop
          appstreamcli validate --no-net data/io.github.beamiter.anvil.metainfo.xml
          file data/io.github.beamiter.anvil-128.png | grep -F '128 x 128'
          file data/io.github.beamiter.anvil-256.png | grep -F '256 x 256'

      - name: Build and verify relocatable release bundle
        if: ${{ !cancelled() }}
        run: |
          bash scripts/package-release.sh target/release/anvil
          (cd target/dist && sha256sum --check *.sha256)
          support_dir="$(mktemp -d)"
          ANVIL_BIN=target/release/anvil bash scripts/support-bundle.sh "${support_dir}"
          support_archives=("${support_dir}"/anvil-support-*.tar.gz)
          test "${#support_archives[@]}" -eq 1
          support_archive="${support_archives[0]}"
          tar -tzf "${support_archive}" | grep -F '/doctor.json'
          tar -tzf "${support_archive}" | grep -F '/doctor.txt'
          if tar -tzf "${support_archive}" | grep -F '/config-check.json'; then
            echo "support bundle unexpectedly contains config-check output" >&2
            exit 1
          fi

      - name: Upload relocatable release bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: anvil-${{ github.sha }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: |
            test.log
            clippy.log
          if-no-files-found: ignore
          retention-days: 7

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate and build flake checks
        run: nix flake check --no-write-lock-file --print-build-logs
