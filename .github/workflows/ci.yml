name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev/shared-terminal-engine-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  shared-gtk-terminal:
    name: Shared GTK terminal and Vim9
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native display test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev \
            at-spi2-core gir1.2-atspi-2.0 python3-gi dbus-x11 xauth xvfb xdotool xclip \
            imagemagick vim sway wtype wl-clipboard libwayland-dev libwayland-bin \
            fonts-dejavu-core fonts-noto-color-emoji
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build the opt-in GTK backend from the production lock
        run: cargo build --locked --release --features shared-terminal --bin anvil
      - name: Verify ordinary tabs, shell exit, caret, input and scrollback under X11
        run: |
          core=$(python3 scripts/shared-core-path.py)
          dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1100x24 -nolisten tcp' \
            /usr/bin/python3 -B "$core/crates/jterm_gtk_view/tests/native.py" \
            anvil target/release/anvil --ordinary-panes --tui --streamed-paste --scrollback-policy \
            --keyboard-disambiguation --resize-history --history-search --hidden-output-seconds 8
          dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1100x24 -nolisten tcp' \
            /usr/bin/python3 -B "$core/crates/jterm_gtk_view/tests/native.py" \
            anvil target/release/anvil --ordinary-panes --shell bash
          dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1100x24 -nolisten tcp' \
            /usr/bin/python3 -B "$core/crates/jterm_gtk_view/tests/native.py" \
            anvil target/release/anvil --shared-runtime --underline-colors --osc8-links
      - name: Verify native and compatibility Vim9 editing and the embedded shell return
        run: |
          core=$(python3 scripts/shared-core-path.py)
          dbus-run-session -- xvfb-run -a --server-args='-screen 0 1440x1100x24 -nolisten tcp' \
            /usr/bin/python3 -B "$core/crates/jterm_gtk_view/tests/native_vim9.py" \
            anvil target/release/anvil
      - name: Verify Wayland terminal and Vim9 composition
        run: |
          set -euo pipefail
          core=$(python3 scripts/shared-core-path.py)
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/gtk-wayland.XXXXXX")
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://archive.ubuntu.com/ubuntu/pool/universe/w/wlroots/wlroots_0.17.1.orig.tar.gz \
            --output "$fixture_dir/wlroots.tar.gz"
          printf '%s  %s\n' b4b1b08daf0728cd2648fb57660493e5b3eafe4fcc081c138de864895181cdfe \
            "$fixture_dir/wlroots.tar.gz" | sha256sum --check
          tar -xzf "$fixture_dir/wlroots.tar.gz" -C "$fixture_dir" \
            wlroots-0.17.1/protocol/input-method-unstable-v2.xml \
            wlroots-0.17.1/protocol/wlr-virtual-pointer-unstable-v1.xml
          bash "$core/crates/jterm_gtk_view/tests/build-wayland-fixtures.sh" \
            "$fixture_dir/wlroots-0.17.1/protocol" "$fixture_dir/clients"
          dbus-run-session -- /usr/bin/python3 -B "$core/crates/jterm_gtk_view/tests/native_wayland.py" \
            anvil target/release/anvil --ordinary-pane --keyboard-disambiguation \
            --output "$RUNNER_TEMP/shared-terminal-wayland" \
            --ime-client "$fixture_dir/clients/native-ime-client" \
            --pointer-client "$fixture_dir/clients/native-pointer"
          dbus-run-session -- /usr/bin/python3 -B "$core/crates/jterm_gtk_view/tests/native_wayland.py" \
            anvil target/release/anvil --ordinary-pane --keyboard-disambiguation --scale 2 \
            --output "$RUNNER_TEMP/shared-terminal-wayland/hidpi" \
            --ime-client "$fixture_dir/clients/native-ime-client" \
            --pointer-client "$fixture_dir/clients/native-pointer"
          for display in native compatibility; do
            dbus-run-session -- /usr/bin/python3 -B "$core/crates/jterm_gtk_view/tests/native_wayland.py" \
              anvil target/release/anvil --vim9 "$display" \
              --output "$RUNNER_TEMP/shared-terminal-wayland/vim9-$display" \
              --ime-client "$fixture_dir/clients/native-ime-client"
          done
      - name: Verify shared live output and completed Block and Chat cards
        run: |
          core=$(python3 scripts/shared-core-path.py)
          bash "$core/crates/jterm_gtk_view/tests/test-native-cards.sh" \
            anvil "$RUNNER_TEMP/shared-terminal-wayland/cards"
      - name: Preserve native protocol and fixture logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shared-terminal-native-${{ github.sha }}
          path: ${{ runner.temp }}/shared-terminal-wayland/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  interaction-contracts:
    name: Pure interaction evidence contracts (no native acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out immutable contract candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify versioned host adapter bundle
        run: python3 tools/check-host-bundle.py

      - name: Verify versioned PTY process bundle
        run: python3 tools/check-process-bundle.py

      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "scripts/materialize-shared-core.sh" ]]; then
            bash "scripts/materialize-shared-core.sh"
          fi
      - name: Validate pure comparator and lineage contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 --version
          PYTHONOPTIMIZE=0 python3 scripts/test-interaction-budget.py
          PYTHONOPTIMIZE=1 python3 scripts/test-interaction-budget.py
          PYTHONOPTIMIZE=0 python3 scripts/test-interaction-lineage.py
          PYTHONOPTIMIZE=1 python3 scripts/test-interaction-lineage.py

  rust:
    name: Rust quality, smoke tests, and bundle
    runs-on: ubuntu-24.04
    # The complete serial GTK + release pipeline exceeded 45m at bundle finish.
    # Keep individual fixture timeouts; allow bounded headroom for the full job.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "scripts/materialize-shared-core.sh" ]]; then
            bash "scripts/materialize-shared-core.sh"
          fi
      - name: Install GTK, VTE, and validation packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            vim \
            ripgrep \
            libxtst6 \
            python3 \
            python3-venv \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-atspi-2.0 \
            at-spi2-core \
            orca \
            openbox \
            appstream \
            desktop-file-utils \
            file \
            dbus-x11 \
            xauth \
            xdotool \
            xvfb

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Bash integration locale and Unicode editing
        run: python3 scripts/test-bash-integration-locale.py

      - name: Check Bash OSC transport and redirected bytes
        run: python3 scripts/test-bash-osc-transport.py

      - name: Check support archive atomic publication
        run: python3 scripts/test-support-bundle.py

      - name: Check Files follow ownership
        run: python3 scripts/test-files-follow.py

      - name: Check search callback lifecycle
        run: python3 scripts/test-search-lifecycle.py

      - name: Check native IME injector focus policy (pure mocks)
        run: python3 scripts/test-qa-native-ime-keyboard.py

      - name: Check workspace search ownership transitions
        run: python3 scripts/test-workspace-search-transition.py

      - name: Verify generated Flatpak Cargo sources
        run: scripts/update-flatpak-cargo-sources.sh --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Mission form adapter without GTK
        run: python3 scripts/test-mission-adapter.py

      - name: Check all targets
        run: bash scripts/check-clean-build.sh

      - name: Run tests
        id: tests
        shell: bash
        run: xvfb-run --auto-servernum cargo test --all-targets --locked --no-fail-fast 2>&1 | tee test.log

      - name: Check native Vim9 editing and navigation
        timeout-minutes: 10
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: |
          set -Eeuo pipefail
          vim_bin="$(command -v "${JTERM_VIM9_BIN:-${VIM9_TEST_VIM:-vim}}")"
          export JTERM_VIM9_BIN="$vim_bin" VIM9_TEST_VIM="$vim_bin"
          "$vim_bin" --version
          cargo_test=(cargo test --locked)
          listed_tests="$("${cargo_test[@]}" vim9_ide -- --include-ignored --list)"
          mapfile -t tests < <(printf '%s\n' "$listed_tests" | sed -n 's/: test$//p')
          if ((${#tests[@]} == 0)); then
            printf 'No Vim9 IDE tests were discovered.\n' >&2
            exit 1
          fi
          # GTK initialization belongs to one OS thread for the whole process.
          # Rust uses a new thread per test even with --test-threads=1.
          failed=0
          for test_name in "${tests[@]}"; do
            if ! dbus-run-session -- xvfb-run --auto-servernum \
              "${cargo_test[@]}" "$test_name" -- --exact --include-ignored --test-threads=1; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Check task accessibility observer failure controls
        run: |
          python3 scripts/test-task-accessibility-observer.py
          PYTHONOPTIMIZE=1 python3 scripts/test-task-accessibility-observer.py

      - name: Run owned AT-SPI and Orca task feedback fixture
        timeout-minutes: 10
        run: |
          mkdir -p task-accessibility-diagnostics
          git rev-parse HEAD > task-accessibility-diagnostics/source-commit.txt
          sha256sum Cargo.lock > task-accessibility-diagnostics/cargo-lock.sha256
          dpkg-query -W libgtk-4-1 libadwaita-1-0 at-spi2-core orca python3-gi openbox \
            > task-accessibility-diagnostics/native-package-versions.txt
          cargo test --locked --no-run --bin anvil --message-format=json \
            > task-accessibility-diagnostics/test-build.jsonl
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root = Path('task-accessibility-diagnostics')
          binaries = []
          for line in (root / 'test-build.jsonl').read_text().splitlines():
              message = json.loads(line)
              if (message.get('reason') == 'compiler-artifact'
                      and message.get('target', {}).get('name') == 'anvil'
                      and message.get('profile', {}).get('test')
                      and message.get('executable')):
                  binaries.append(message['executable'])
          if len(binaries) != 1:
              raise RuntimeError(f'Expected one Anvil test executable, got {binaries}')
          (root / 'test-binary.txt').write_text(str(Path(binaries[0]).resolve()) + '\n')
          PYCODE
          binary="$(cat task-accessibility-diagnostics/test-binary.txt)"
          sha256sum "$binary" > task-accessibility-diagnostics/test-binary.sha256
          bash scripts/test-task-accessibility.sh "$binary" "$PWD/task-accessibility-diagnostics/native"

      - name: Upload task accessibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: task-accessibility-diagnostics
          path: task-accessibility-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Check GTK runner failure aggregation
        run: python3 scripts/test-gtk-display-contract.py

      - name: Run dialog control theme state and geometry fixture
        timeout-minutes: 3
        env:
          PYTHONOPTIMIZE: "0"
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          python3 scripts/test-dialog-controls-preparation.py
          mkdir -p gtk-paint-diagnostics/dialog-controls
          python3 scripts/prepare-dialog-controls-theme.py gtk-paint-diagnostics/dialog-controls
          dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            /usr/bin/python3 scripts/test-dialog-controls-theme.py \
            --baseline gtk-paint-diagnostics/dialog-controls/baseline.css \
            --candidate gtk-paint-diagnostics/dialog-controls/candidate.css \
            --artifacts gtk-paint-diagnostics/dialog-controls

      - name: Run display-backed GTK/VTE regressions
        run: GTK_PAINT_DIAGNOSTICS_DIR="$PWD/gtk-paint-diagnostics" ANVIL_XTEST_DRIVER="$PWD/scripts/qa-cross-selection-pointer.py" bash scripts/test-gtk-display.sh 2>&1 | tee gtk-display.log

      - name: Upload synthetic GTK paint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gtk-paint-diagnostics
          path: |
            gtk-paint-diagnostics/
            gtk-display.log
          if-no-files-found: ignore
          retention-days: 7


      - name: Run Clippy
        id: clippy
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/clippy.sh 2>&1 | tee clippy.log

      - name: Check documentation build
        if: ${{ !cancelled() }}
        run: cargo doc --no-deps --locked

      - name: Build optimized release binary
        if: ${{ !cancelled() }}
        run: cargo build --release --locked

      - name: Validate install and support scripts
        if: ${{ !cancelled() }}
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-paths.sh \
            scripts/package-release.sh scripts/support-bundle.sh packaging/install-release.sh
          scripts/install.sh --help >/dev/null
          scripts/uninstall.sh --help >/dev/null
          bash scripts/test-install-paths.sh
          bash scripts/test-release-install.sh
          bash scripts/test-package-buildinfo.sh
          install_plan="$(scripts/install.sh --backend cargo --no-config --no-desktop --dry-run)"
          grep -F "Installed anvil to ${HOME}/.local/bin/anvil" <<<"${install_plan}"

          prefix_plan="$(scripts/install.sh --backend cargo --no-config --no-desktop \
            --prefix /opt/anvil-prefix --dry-run)"
          grep -F "Installed anvil to /opt/anvil-prefix/bin/anvil" <<<"${prefix_plan}"

          bin_plan="$(scripts/install.sh --backend cargo --no-config --no-desktop \
            --prefix /opt/anvil-prefix --bin-dir /opt/anvil-bin --dry-run)"
          grep -F "Installed anvil to /opt/anvil-bin/anvil" <<<"${bin_plan}"

          uninstall_stage="$(mktemp -d)"
          trap 'rm -rf -- "${uninstall_stage}"' EXIT
          install -Dm0755 /bin/true "${uninstall_stage}${HOME}/.local/bin/anvil"
          uninstall_plan="$(DESTDIR="${uninstall_stage}" scripts/uninstall.sh --dry-run)"
          grep -F "${uninstall_stage}${HOME}/.local/bin/anvil" <<<"${uninstall_plan}"

      - name: Validate CLI and desktop integration
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          target/release/anvil --help | grep -F "Block-first terminal workspace"
          version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          target/release/anvil --version | grep -Fx "anvil ${version}"
          target/release/anvil --doctor
          target/release/anvil --doctor --json | python3 -m json.tool >/dev/null
          target/release/anvil --check-config config.toml.example --json | \
            python3 -m json.tool >/dev/null

          config_root="$(mktemp -d)"
          install -d -m 0700 "${config_root}/anvil"
          cp config.toml.example "${config_root}/anvil/config.toml"
          XDG_CONFIG_HOME="${config_root}" target/release/anvil --check-config
          test "$(XDG_CONFIG_HOME="${config_root}" target/release/anvil --config-path)" = \
            "${config_root}/anvil/config.toml"

          cp "${config_root}/anvil/config.toml" "${config_root}/anvil/config.toml.bak"
          printf 'opacity = "wrong"\n' >"${config_root}/anvil/config.toml"
          if XDG_CONFIG_HOME="${config_root}" target/release/anvil --check-config; then
            echo "invalid configuration unexpectedly passed validation" >&2
            exit 1
          fi
          XDG_CONFIG_HOME="${config_root}" target/release/anvil --restore-config-backup
          XDG_CONFIG_HOME="${config_root}" target/release/anvil --check-config
          test -s "${config_root}/anvil/config.toml.before-restore"
          desktop-file-validate data/io.github.beamiter.anvil.desktop
          appstreamcli validate --no-net data/io.github.beamiter.anvil.metainfo.xml
          file data/io.github.beamiter.anvil-128.png | grep -F '128 x 128'
          file data/io.github.beamiter.anvil-256.png | grep -F '256 x 256'

      - name: Build and verify relocatable release bundle
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash scripts/package-release.sh target/release/anvil
          (cd target/dist && sha256sum --check ./*.sha256)
          support_dir="$(mktemp -d)"
          ANVIL_BIN=target/release/anvil bash scripts/support-bundle.sh "${support_dir}"
          support_archives=("${support_dir}"/anvil-support-*.tar.gz)
          test "${#support_archives[@]}" -eq 1
          support_archive="${support_archives[0]}"
          tar -tzf "${support_archive}" | grep -F '/doctor.json'
          tar -tzf "${support_archive}" | grep -F '/doctor.txt'
          if tar -tzf "${support_archive}" | grep -F '/config-check.json'; then
            echo "support bundle unexpectedly contains config-check output" >&2
            exit 1
          fi

      - name: Upload relocatable release bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: anvil-${{ github.sha }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-diagnostics
          path: |
            test.log
            clippy.log
            gtk-display.log
          if-no-files-found: ignore
          retention-days: 7

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "scripts/materialize-shared-core.sh" ]]; then
            bash "scripts/materialize-shared-core.sh"
          fi
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086  # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate and build flake checks
        run: nix flake check --no-write-lock-file --print-build-logs
