name: Security

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  dependency-and-shell-audit:
    name: Dependency and shell audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo-audit-target
          key: ${{ runner.os }}-security-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-security-

      - name: Install audit tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck
          CARGO_TARGET_DIR="$HOME/.cache/cargo-audit-target" \
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" \
            --locked --force
          cargo audit --version | grep -Eq \
            "[[:space:]]${CARGO_AUDIT_VERSION}$"

      - name: Audit dependencies and shell scripts
        run: bash scripts/security-check.sh
